name: Staging Server Deploy

on:
  push:
    branches: [ main ]

env:
  PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  HOME: /Users/mini

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix Docker Config for Headless Runner
        run: |
          mkdir -p ~/.docker
          python3 -c "
          import json, os
          cfg_path = os.path.expanduser('~/.docker/config.json')
          if os.path.exists(cfg_path):
              try:
                  with open(cfg_path, 'r') as f:
                      data = json.load(f)
                  data.pop('credsStore', None)
                  data.pop('credHelpers', None)
                  with open(cfg_path, 'w') as f:
                      json.dump(data, f, indent=2)
              except Exception as e:
                  print('Config cleanup error:', e)
          "

      - name: Deploy Staging Container
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          docker compose build
          docker rm -f rag_staging_backend || true
          docker compose up -d --remove-orphans
          docker system prune -f

name: Staging Server Deploy

on:
  push:
    branches: [ main ]

env:
  PATH: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  HOME: /Users/mini

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix Docker Credential Helper for Headless Runner
        run: |
          mkdir -p ~/.docker
          if [ -f ~/.docker/config.json ]; then
            sed -i '' 's/"credsStore": "desktop"//g' ~/.docker/config.json 2>/dev/null || true
            sed -i '' 's/"credsStore": "osxkeychain"//g' ~/.docker/config.json 2>/dev/null || true
          fi

      - name: Deploy Staging Container
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          docker compose build
          docker rm -f rag_staging_backend || true
          docker compose up -d --remove-orphans
          docker system prune -f


<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Northwestern Staff Handbook Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090d16;
            --bg-surface: rgba(17, 24, 39, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --user-bubble: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --bot-bubble: rgba(31, 41, 55, 0.85);
            --success: #10b981;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Mobile First App Shell */
        .app-container {
            width: 100%;
            height: 100%;
            max-width: 900px;
            max-height: 100%;
            background: var(--bg-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        @media (min-width: 768px) {
            .app-container {
                height: 94vh;
                border: 1px solid var(--panel-border);
                border-radius: 20px;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            }
        }

        /* Utility Icons */
        .icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: inline-block;
            vertical-align: middle;
        }

        /* Header */
        header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 17, 29, 0.85);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--accent-purple));
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .brand-text h1 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .brand-text p {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        /* Chat Scroll Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            gap: 10px;
            max-width: 88%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.bot {
            align-self: flex-start;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .bot .avatar {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .user .avatar {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        .bot .bubble {
            background: var(--bot-bubble);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--panel-border);
        }

        .message-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
            padding: 0 4px;
        }

        .section-tag {
            display: inline-block;
            background: rgba(99, 102, 241, 0.12);
            color: #a5b4fc;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.68rem;
            border: 1px solid rgba(99, 102, 241, 0.25);
            margin-top: 4px;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 16px;
            background: var(--bot-bubble);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--panel-border);
            width: fit-content;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Quick Suggestions Chips */
        .suggestions-container {
            padding: 6px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background: rgba(11, 17, 29, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .suggestions-container::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.76rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .chip:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.4);
            color: #ffffff;
        }

        /* Input Bar */
        .input-bar {
            padding: 12px 16px;
            background: rgba(11, 17, 29, 0.9);
            border-top: 1px solid var(--panel-border);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .chat-input {
            width: 100%;
            background: rgba(31, 41, 55, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .chat-input:focus {
            border-color: var(--primary);
            background: rgba(31, 41, 55, 0.9);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .btn-send {
            background: var(--primary);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .btn-send:hover {
            background: var(--primary-hover);
            transform: scale(1.02);
        }

        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 22, 0.88);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-card {
            background: rgba(31, 41, 55, 0.95);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            animation: modalPop 0.3s ease;
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-card h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .modal-card p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .quick-fill {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            margin-bottom: 16px;
        }

        .quick-fill button {
            flex: 1;
            padding: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.72rem;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .error-msg {
            color: #f87171;
            font-size: 0.78rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <header>
            <div class="brand-info">
                <div class="logo-icon">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <div class="brand-text">
                    <h1 id="txtAppTitle">Northwestern Handbook AI</h1>
                    <p id="txtAppSubtitle">Staff Knowledge Assistant</p>
                </div>
            </div>

            <div class="header-actions">
                <button class="lang-btn" onclick="toggleLanguage()" id="btnLangToggle">
                    🌐 <span id="txtLangCode">TR</span>
                </button>
                <button class="btn-action" id="btnAdminIngest" onclick="triggerIngest()" style="display:none;" title="Rebuild DB">
                    ⚡ <span id="txtRebuild">Rebuild</span>
                </button>
                <a href="/docs" target="_blank" class="btn-action" title="API Docs">
                    📑 Docs
                </a>
                <button class="btn-action" onclick="logout()" title="Logout">
                    🚪
                </button>
            </div>
        </header>

        <!-- Chat Container -->
        <div class="chat-container" id="chatContainer">
            <!-- Dynamic Welcome Message will be injected here on load -->
        </div>

        <!-- Quick Suggestions Chips -->
        <div class="suggestions-container" id="suggestionsContainer">
            <!-- Injected by JS based on selected language -->
        </div>

        <!-- Input Bar -->
        <form class="input-bar" onsubmit="handleSend(event)">
            <div class="input-wrapper">
                <input type="text" class="chat-input" id="userInput" placeholder="Bir soru sorun..." autocomplete="off">
            </div>
            <button type="submit" class="btn-send" id="sendBtn">
                <svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </form>

        <!-- Login Modal Overlay -->
        <div class="modal-overlay" id="loginModal">
            <div class="modal-card">
                <h2 id="txtLoginTitle">Giriş Yap</h2>
                <p id="txtLoginDesc">Devam etmek için hesabınızla giriş yapın.</p>
                
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label id="lblUsername">Kullanıcı Adı</label>
                        <input type="text" id="username" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label id="lblPassword">Şifre</label>
                        <input type="password" id="password" class="form-input" required>
                    </div>

                    <div class="quick-fill">
                        <button type="button" onclick="quickFill('staff', 'nu2026pass')">👤 Staff User</button>
                        <button type="button" onclick="quickFill('admin', 'admin*123!')">⚡ Admin User</button>
                    </div>

                    <button type="submit" class="btn-submit" id="btnSignIn">Giriş Yap ve Başla</button>
                    <div class="error-msg" id="loginError"></div>
                </form>
            </div>
        </div>

    </div>

    <script>
        let currentLang = localStorage.getItem('rag_lang') || 'tr';
        let authToken = localStorage.getItem('rag_token') || null;
        let userRole = localStorage.getItem('rag_role') || null;

        const i18n = {
            tr: {
                title: "Northwestern Handbook AI",
                subtitle: "Personel Bilgi Asistanı",
                rebuild: "Yenile",
                placeholder: "El kitabı hakkında bir soru sorun...",
                loginTitle: "Sisteme Giriş Yapın",
                loginDesc: "Northwestern El Kitabı Asistanına erişmek için giriş yapın.",
                lblUsername: "Kullanıcı Adı",
                lblPassword: "Şifre",
                btnSignIn: "Giriş Yap ve Başla",
                loginErr: "Kullanıcı adı veya şifre hatalı.",
                welcomeMsg: "Merhaba! Northwestern University Personel El Kitabı Asistanına hoş geldiniz. Personel hakları, izinler, sağlık sigortası ve üniversite politikaları hakkında bana dilediğiniz soruyu sorabilirsiniz.",
                sectionLabel: "Bölüm:",
                connErr: "Bağlantı hatası: Sunucuya ulaşılamıyor.",
                chips: [
                    { label: "🏖️ Tatil Politikası", query: "Tatil izin hakları ve yıllık izin kuralları nedir?" },
                    { label: "🏠 Uzaktan Çalışma", query: "Uzaktan çalışma (Remote Work) politikası nasıldır?" },
                    { label: "🏥 Sağlık & Yan Haklar", query: "Sağlık sigortası ve yan haklar nelerdir?" },
                    { label: "🎉 Resmi Tatiller", query: "Üniversite resmi tatil günleri hangileridir?" }
                ]
            },
            en: {
                title: "Northwestern Handbook AI",
                subtitle: "Staff Knowledge Assistant",
                rebuild: "Rebuild",
                placeholder: "Ask a question about the staff handbook...",
                loginTitle: "Sign In",
                loginDesc: "Log in to access Northwestern Staff Handbook Assistant.",
                lblUsername: "Username",
                lblPassword: "Password",
                btnSignIn: "Sign In & Start",
                loginErr: "Invalid username or password.",
                welcomeMsg: "Hello! Welcome to Northwestern University Staff Handbook Assistant. You can ask me any questions regarding staff policies, vacation allowances, health benefits, and university guidelines.",
                sectionLabel: "Section:",
                connErr: "Connection error: Server unreachable.",
                chips: [
                    { label: "🏖️ Vacation Policy", query: "What is the vacation policy and accrual rate?" },
                    { label: "🏠 Remote Work Policy", query: "What are the rules for remote work?" },
                    { label: "🏥 Health & Benefits", query: "What health insurance and benefits are provided?" },
                    { label: "🎉 University Holidays", query: "What are the official university holidays?" }
                ]
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            applyLanguage();
            if (authToken) {
                hideLoginModal();
                checkUserRole();
                initWelcomeMessage();
            } else {
                showLoginModal();
            }
        });

        function toggleLanguage() {
            currentLang = currentLang === 'tr' ? 'en' : 'tr';
            localStorage.setItem('rag_lang', currentLang);
            applyLanguage();
            
            // Reload welcome message in new language if chat is fresh
            const container = document.getElementById('chatContainer');
            if (container.children.length <= 1) {
                container.innerHTML = '';
                initWelcomeMessage();
            }
        }

        function applyLanguage() {
            const t = i18n[currentLang];
            document.getElementById('txtLangCode').innerText = currentLang.toUpperCase();
            document.getElementById('txtAppTitle').innerText = t.title;
            document.getElementById('txtAppSubtitle').innerText = t.subtitle;
            document.getElementById('txtRebuild').innerText = t.rebuild;
            document.getElementById('userInput').placeholder = t.placeholder;
            
            document.getElementById('txtLoginTitle').innerText = t.loginTitle;
            document.getElementById('txtLoginDesc').innerText = t.loginDesc;
            document.getElementById('lblUsername').innerText = t.lblUsername;
            document.getElementById('lblPassword').innerText = t.lblPassword;
            document.getElementById('btnSignIn').innerText = t.btnSignIn;

            renderChips();
        }

        function renderChips() {
            const chipsContainer = document.getElementById('suggestionsContainer');
            chipsContainer.innerHTML = '';
            i18n[currentLang].chips.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.type = 'button';
                btn.innerText = c.label;
                btn.onclick = () => sendQuickQuery(c.query);
                chipsContainer.appendChild(btn);
            });
        }

        function initWelcomeMessage() {
            const container = document.getElementById('chatContainer');
            if (container.children.length > 0) return;

            const typingElem = appendTypingIndicator();
            setTimeout(() => {
                typingElem.remove();
                appendBotMessage(i18n[currentLang].welcomeMsg, false, null);
            }, 1000);
        }

        function showLoginModal() {
            document.getElementById('loginModal').style.display = 'flex';
        }

        function hideLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
        }

        function checkUserRole() {
            if (userRole === 'admin') {
                document.getElementById('btnAdminIngest').style.display = 'inline-flex';
            } else {
                document.getElementById('btnAdminIngest').style.display = 'none';
            }
        }

        function quickFill(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('loginError');

            errorDiv.style.display = 'none';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                if (!res.ok) throw new Error(i18n[currentLang].loginErr);

                const data = await res.json();
                authToken = data.access_token;
                userRole = u === 'admin' ? 'admin' : 'user';

                localStorage.setItem('rag_token', authToken);
                localStorage.setItem('rag_role', userRole);

                hideLoginModal();
                checkUserRole();
                initWelcomeMessage();
            } catch (err) {
                errorDiv.innerText = err.message || i18n[currentLang].loginErr;
                errorDiv.style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('rag_token');
            localStorage.removeItem('rag_role');
            authToken = null;
            userRole = null;
            document.getElementById('chatContainer').innerHTML = '';
            showLoginModal();
        }

        function sendQuickQuery(text) {
            document.getElementById('userInput').value = text;
            handleSend(new Event('submit'));
        }

        async function handleSend(e) {
            if (e) e.preventDefault();
            const input = document.getElementById('userInput');
            const query = input.value.trim();
            if (!query) return;

            if (!authToken) {
                showLoginModal();
                return;
            }

            appendUserMessage(query);
            input.value = '';

            const typingElem = appendTypingIndicator();
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ question: query, lang: currentLang })
                });

                typingElem.remove();
                sendBtn.disabled = false;

                if (res.status === 401) {
                    logout();
                    alert(currentLang === 'tr' ? 'Oturum süresi doldu. Lütfen tekrar giriş yapın.' : 'Session expired. Please log in again.');
                    return;
                }

                if (!res.ok) {
                    const errData = await res.json();
                    appendBotMessage(`Error: ${errData.detail || 'Failed to get answer.'}`, false, null);
                    return;
                }

                const data = await res.json();
                appendBotMessage(data.answer, data.source_found, data.section);

            } catch (err) {
                typingElem.remove();
                sendBtn.disabled = false;
                appendBotMessage(i18n[currentLang].connErr, false, null);
            }
        }

        function appendUserMessage(text) {
            const container = document.getElementById('chatContainer');
            const row = document.createElement('div');
            row.className = 'message-row user';
            row.innerHTML = `
                <div class="avatar">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </div>
                <div class="message-content">
                    <div class="bubble">${escapeHtml(text)}</div>
                    <div class="message-meta">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                </div>
            `;
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function appendBotMessage(text, sourceFound, section) {
            const container = document.getElementById('chatContainer');
            const row = document.createElement('div');
            row.className = 'message-row bot';

            let metaInfo = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            if (sourceFound && section) {
                metaInfo += ` • <span class="section-tag">${i18n[currentLang].sectionLabel} ${escapeHtml(section)}</span>`;
            }

            row.innerHTML = `
                <div class="avatar">
                    <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
                </div>
                <div class="message-content">
                    <div class="bubble">${escapeHtml(text)}</div>
                    <div class="message-meta">${metaInfo}</div>
                </div>
            `;
            container.appendChild(row);
            container.scrollTop = container.scrollHeight;
        }

        function appendTypingIndicator() {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'message-row bot';
            div.innerHTML = `
                <div class="avatar">
                    <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>
                </div>
                <div class="typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        async function triggerIngest() {
            const msg = currentLang === 'tr' ? "Vektör veritabanını baştan oluşturmak istediğinize emin misiniz?" : "Are you sure you want to rebuild the vector database?";
            if (!confirm(msg)) return;
            try {
                const res = await fetch('/api/admin/ingest', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();
                if (res.ok) {
                    alert(`Başarılı: ${data.message} (Toplam ${data.total_chunks} chunk)`);
                } else {
                    alert(`Hata: ${data.detail}`);
                }
            } catch (err) {
                alert("Veritabanı yenileme hatası: " + err);
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[m]);
        }
    </script>
</body>
</html>
